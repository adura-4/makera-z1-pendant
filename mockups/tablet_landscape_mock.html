<!doctype html>
<html><head><meta charset="utf-8"><title>Tablet landscape mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;600&display=block">
<style>
  :root{--bg:#0B1120;--sv:#172033;--sc:#1E293B;--onsc:#E2E8F0;--primary:#38BDF8;--onprimary:#00222F;--muted:#94A3B8;--outline:#5b6474;--text:#E6E9EF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9edf2;font-family:Roboto,Arial,sans-serif;padding:24px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
  .cap{font:600 16px "Segoe UI",Arial;color:#1f2937}
  .ms{font-family:'Material Symbols Rounded';font-size:26px;line-height:1;font-weight:500}
  .mono{font-family:"Roboto Mono",Consolas,monospace}
  .tab{width:1194px;height:834px;background:var(--bg);border-radius:30px;overflow:hidden;color:var(--text);padding:28px 18px 14px;display:flex;flex-direction:column;position:relative}
  .status{position:absolute;top:8px;left:24px;right:24px;display:flex;justify-content:space-between;font-size:12px;color:#cbd5e1}
  .hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .hdr .name{flex:1}.hdr b{font-size:18px;font-weight:500;display:block}.hdr span{font-size:12px;color:var(--muted)}
  .pill{background:#16A34A;color:#fff;font-weight:700;font-size:15px;border-radius:99px;padding:7px 18px}
  .ico{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#cbd5e1}
  .ico .ms{font-size:28px}
  .main{flex:1;display:flex;gap:18px;min-height:0}
  .left{width:560px;display:flex;flex-direction:column;gap:10px}
  .right{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
  .dro{background:var(--sv);border-radius:14px;padding:4px 0}
  .row{display:flex;align-items:center;padding:2px 12px;height:74px}
  .row.sel{background:rgba(56,189,248,.15)}
  .row .ax{width:50px;font-size:40px;font-weight:700;color:var(--muted)}
  .row.sel .ax{color:var(--primary)}
  .row .val{flex:1;text-align:right}
  .row .val b{font-size:50px;font-weight:600;line-height:52px;display:block}
  .row .val span{font-size:17px;color:var(--muted)}
  .ob{border:1px solid var(--outline);border-radius:99px;color:var(--primary);font-size:17px;height:46px;display:flex;align-items:center;justify-content:center;padding:0 16px;margin-left:8px}
  .ob.w{min-width:88px}
  .seg{display:flex;height:44px;border:1px solid var(--outline);border-radius:10px;overflow:hidden}
  .seg div{flex:1;display:flex;align-items:center;justify-content:center;font-size:17px}
  .seg .on{background:var(--primary);color:var(--onprimary);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{background:var(--sc);border-radius:12px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13px;color:var(--onsc)}
  .tile.on{color:#fff;font-weight:600}.tile.dim{color:rgba(226,232,240,.35)}
  .tile.empty{background:transparent;border:1px dashed rgba(148,163,184,.18)}
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  .mode{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:12px;background:var(--sc);display:flex;align-items:center;justify-content:center}
  .ctl{background:var(--sv);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
  .feed{display:flex;align-items:center;gap:12px;font-size:16px}
  .feed .bar{flex:1;height:14px;border-radius:7px;background:var(--sc);position:relative}
  .feed .bar i{position:absolute;left:0;top:0;bottom:0;width:47%;background:var(--primary);border-radius:7px}
  .feed .bar u{position:absolute;left:47%;top:-8px;width:4px;height:30px;background:var(--primary);border-radius:2px}
  .btns{display:flex;gap:10px}
  .btns div{flex:1;height:56px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;color:#fff}
  .btns div{background:var(--sc)}
  .btns .hold{color:#F59E0B}.btns .res{color:#22C55E}.btns .rst{color:#F87171}
  .btns .hold.lit{background:#D97706;color:#fff}.btns .res.lit{background:#16A34A;color:#fff}.btns .rst.lit{background:#DC2626;color:#fff}
  .pill.run{background:#2563EB}
  .cross{display:grid;grid-template-columns:repeat(3,104px);grid-template-rows:repeat(3,104px);gap:9px}
  .jb{background:var(--sc);border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:34px;color:var(--onsc)}
  .hub{border-radius:50%;background:rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
  .hub b{font-size:26px;color:var(--text)}
  .rails{display:flex;gap:14px;margin-left:22px}
  .rail{display:flex;flex-direction:column;justify-content:center;gap:24px;height:330px}
  .rail .jb{width:104px;height:104px}
  .note{width:1194px;font:14px/1.5 "Segoe UI",Arial;color:#374151}
</style></head>
<body>

<div class="cap">Idle: Hold / Resume / Reset muted (app-themed tiles, colored text)</div>
<div class="tab" id="t1"></div>

<div class="cap">Running: Hold and Reset light up (on hold, Resume lights up green instead)</div>
<div class="tab" id="t2"></div>

<script>
const tiles=[['home','Home'],['lock_open','Unlock'],['gps_fixed','Zero XY'],['vertical_align_bottom','Zero Z'],
  ['center_focus_strong','Go to XY0'],['vertical_align_top','Z up'],['lightbulb','Light','on'],['air','Vacuum','dim'],['stop','Spindle stop']];
function left(sel){
  const rows=[['X','30.700','-85.448'],['Y','20.000','-106.980'],['Z','1.000','-1.000'],['A','-90.000','0.000']]
    .map(([a,v,m])=>`<div class="row ${a==sel?'sel':''}"><div class="ax">${a}</div><div class="val mono"><b>${v}</b><span>M ${m}</span></div><div class="ob">move</div><div class="ob w">zero</div></div>`).join('');
  let g=tiles.map(([i,l,c])=>`<div class="tile ${c||''}"><span class="ms">${i}</span>${l}</div>`).join('');
  for(let k=tiles.length;k<12;k++) g+='<div class="tile empty"></div>';
  return {rows,g};
}
function screen(pad,state){ state=state||'Idle'; const run=state=='Run', hold=state=='Hold';
  const sel=pad?'':'X'; const {rows,g}=left(sel);
  const steps=pad?['0.01','0.1','1','5','10','25']:['0.005','0.01','0.1','1','5'];
  const on=pad?'1':'0.1';
  const seg=steps.map(s=>`<div class="${s==on?'on':''}">${s}</div>`).join('');
  const dial=`<svg width="600" height="600" viewBox="0 0 300 300" class="dial">
      <circle cx="150" cy="150" r="147" fill="#172033" stroke="rgba(148,163,184,.25)" stroke-width="3"/>
      ${Array.from({length:30},(_,i)=>{const t=(i*12-90)*Math.PI/180,maj=i%5==0,r0=150*(maj?.78:.84),r1=150*.93;
        return `<line x1="${150+r0*Math.cos(t)}" y1="${150+r0*Math.sin(t)}" x2="${150+r1*Math.cos(t)}" y2="${150+r1*Math.sin(t)}" stroke="${maj?'rgba(148,163,184,.9)':'rgba(148,163,184,.5)'}" stroke-width="${maj?3.3:1.8}" stroke-linecap="round"/>`}).join('')}
      <circle cx="150" cy="60" r="13" fill="#38BDF8"/>
      <line x1="150" y1="7" x2="150" y2="42" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="150" cy="150" r="69" fill="rgba(0,0,0,.25)"/>
      <text x="150" y="160" text-anchor="middle" font-size="40" font-weight="700" fill="#38BDF8" font-family="Roboto,Arial">X</text>
      <text x="150" y="188" text-anchor="middle" font-size="12" fill="#94A3B8" font-family="Roboto Mono,monospace">0.1mm/click</text></svg>`;
  const padHtml=`<div style="display:flex;align-items:center"><div class="cross">
      <div></div><div class="jb">−Y</div><div></div>
      <div class="jb">−X</div><div class="hub"><b>1</b>mm</div><div class="jb">+X</div>
      <div></div><div class="jb">+Y</div><div></div></div>
      <div class="rails"><div class="rail"><div class="jb">+Z</div><div class="jb">−Z</div></div><div class="rail"><div class="jb">+A</div><div class="jb">−A</div></div></div></div>`;
  const modeIcon=pad?'<span class="ms" style="color:#38BDF8">radio_button_checked</span>':'<span class="ms" style="color:#38BDF8">joystick</span>';
  return `<div class="status"><span>3:10 AM&nbsp;&nbsp;Sat Nov 14</span><span>Wi-Fi&nbsp;&nbsp;64%</span></div>
   <div class="hdr"><div class="name"><b>Makera_Z1P_024816</b><span>192.168.1.48 · 24 ms</span></div>
     <div class="pill ${run?'run':''}">${state}</div><div class="ico"><span class="ms">terminal</span></div><div class="ico"><span class="ms">settings</span></div></div>
   <div class="main">
     <div class="left"><div class="dro">${rows}</div><div class="grid">${g}</div>
       <div style="flex:1"></div>
       <div class="ctl"><div class="feed"><span>Feed</span><div class="bar"><i></i><u></u></div><span class="mono">100%</span><span style="color:#38BDF8">100</span></div>
         <div class="btns"><div class="hold ${run?'lit':''}">Hold</div><div class="res ${hold?'lit':''}">Resume</div><div class="rst ${run||hold?'lit':''}">Reset</div></div></div>
     </div>
     <div class="right">
       <div class="seg mono">${seg}</div>
       <div class="stage"><div class="mode">${modeIcon}</div>${pad?padHtml:dial}</div>
     </div>
   </div>`;
}
document.getElementById('t1').innerHTML=screen(false);
document.getElementById('t2').innerHTML=screen(false,'Run');
</script>
</body></html>
